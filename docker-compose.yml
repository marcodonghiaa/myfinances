# Assumes alopex-web checked out as a sibling directory by default:
#   git clone https://github.com/marcodonghiaa/alopex.git
#   git clone https://github.com/marcodonghiaa/alopex-web.git
# If it lives elsewhere, set FRONTEND_DIR (in .env or the shell env) to its
# path. Both apps still connect to your own Supabase Cloud project -- this
# does not containerize Supabase itself. Copy .env.example to .env here
# first (it also carries the frontend's VITE_* build args, read by docker
# compose automatically from this file's .env).
services:
  sync:
    build: .
    env_file: .env
    volumes:
      - sync-state:/data
    restart: unless-stopped

  web:
    build:
      context: ${FRONTEND_DIR:-../alopex-web}
      args:
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
    # Only this computer by default: the dashboard is plain HTTP. To open it from your phone on
    # the same network, set WEB_BIND=0.0.0.0 in .env (anyone on that network can then reach it).
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    restart: unless-stopped

volumes:
  sync-state:
