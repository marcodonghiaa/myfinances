name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The Edge Functions are TypeScript for Deno: check they compile and run their unit tests.
      - run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts
      - run: deno test --no-lock --node-modules-dir=none supabase/functions/_shared
