name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The Edge Functions are TypeScript for Deno: check they compile and run their unit tests.
      - run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts
      - run: deno test --no-lock --node-modules-dir=none supabase/functions/_shared
  devcontainer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'
      - if: steps.changes.outputs.devcontainer == 'true'
        uses: devcontainers/ci@v0.3
        with:
          runCmd: supabase --version && node --version
          push: never
