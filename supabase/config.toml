# Only the settings this project actually sets; the Supabase CLI fills in
# defaults for everything else (see `supabase init` for the full reference).
project_id = "finance_app"

[db]
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# The app has no sign-up screen; setup.sh creates the one login. Keep the Auth API closed too.
enable_signup = false

# bank-consent-callback is a plain browser redirect from the bank: no Authorization header.
[functions.list-banks]
verify_jwt = true

[functions.start-bank-consent]
verify_jwt = true

[functions.bank-consent-callback]
verify_jwt = false

[functions.add-holding]
verify_jwt = true
